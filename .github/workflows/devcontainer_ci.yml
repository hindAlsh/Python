name: Test DevContainer Build

on:
  push:
    paths:
      - ".devcontainer/**"
      - ".github/workflows/devcontainer_ci.yml"
  pull_request:
    paths:
      - ".devcontainer/**"
      - ".github/workflows/devcontainer_ci.yml"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: devcontainers/ci@v0.3
        with:
          push: never
          runCmd: >-
            bash -n .devcontainer/post_install &&
            pre-commit --version &&
            ruff --version &&
            uv --version &&
            test -f .python-version
